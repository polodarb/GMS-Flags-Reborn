# Placeholder default for NEEDLE_TRUSTED_PUBLIC_KEY_BASE64 - a build using this value will never
# verify any recipe signature as trusted (which is the safe failure mode). Override locally in a
# git-ignored secrets.properties file in this same directory with the real ECDSA P-256 public key
# to build against the real recipe backend.
NEEDLE_TRUSTED_PUBLIC_KEY_BASE64=MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==

# Placeholder default for TRUSTED_APP_SIGNATURE_SHA256 - a build using this value will never
# report as "official" (safe failure mode). Override locally in a git-ignored secrets.properties
# file in this same directory with the real release signing-certificate fingerprint.
TRUSTED_APP_SIGNATURE_SHA256=00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00:00
